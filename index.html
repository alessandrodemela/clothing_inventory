<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12141a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Guardaroba" />
  <title>Guardaroba</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="topbar">
      <div class="topbar-row">
        <h1 class="app-title">Guardaroba<span class="app-title-dot">.</span></h1>
        <button id="refreshBtn" class="icon-btn" type="button" aria-label="Aggiorna dati" title="Aggiorna">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="searchInput" class="search-input" type="search" placeholder="Cerca per nome, categoria, colore, marca…" autocomplete="off" spellcheck="false" />
        <button id="clearSearch" class="clear-btn" type="button" aria-label="Cancella ricerca" hidden>&times;</button>
      </div>

      <p class="sync-line" id="syncLine">Caricamento…</p>
    </header>

    <!-- Quick stats -->
    <section class="stats-row" id="statsRow" aria-label="Statistiche rapide"></section>

    <!-- View toggle -->
    <div class="view-toggle" id="viewToggle" role="tablist" aria-label="Raggruppamento">
      <button class="toggle-btn is-active" data-view="category" role="tab" aria-selected="true" type="button">Per categoria</button>
      <button class="toggle-btn" data-view="location" role="tab" aria-selected="false" type="button">Per posizione</button>
    </div>

    <!-- Filter chips -->
    <div class="chips-row" id="filterChips" role="group" aria-label="Filtro rapido"></div>

    <!-- Main content -->
    <main id="content" class="content"></main>

    <p class="empty-state" id="emptyState" hidden>Nessun capo trovato.</p>
    <p class="error-state" id="errorState" hidden></p>

  </div>

  <!-- Bottom sheet: item detail -->
  <div class="sheet-overlay" id="sheetOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet">
      <div class="sheet-handle"></div>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Chiudi">&times;</button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('/sw.js')
          .catch(err => console.warn('SW non registrato:', err))
      );
    }
  </script>
</body>
</html>
